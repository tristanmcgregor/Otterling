name: Claude Code Review

# AI code review, advisory only -- like update-review.yml, this cannot publish
# anything. See filter-server/SELF_LOCKOUT.md: releases are server-side only.

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ github.ref_name }}
            COMMIT: ${{ github.sha }}

            Review the changes introduced by this push (diff against the branch's
            merge-base with main) for correctness bugs and reuse/simplification/
            efficiency issues. Post the findings as a commit comment on ${{ github.sha }}.
          claude_args: |
            --allowed-tools "Bash(git diff:*),Bash(git log:*),Bash(gh api:*)"
