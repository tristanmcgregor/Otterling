name: Update review, sign, and publish

# Otterling's only production update path: every change gets an AI diff review against
# scripts/update_review_checklist.md (job below), and only if that passes AND a human Guardian
# approves the protected `release` GitHub Environment does anything get signed with the real
# release key and published to the family's own update host. See scripts/update_review_checklist.md
# and the "Gated updates" section of the top-level README for the full trust model and one-time
# setup (secrets + environment protection rule) this workflow depends on.
#
# NOTE for whoever wires this up: pin `anthropics/claude-code-action` to a specific released
# version (check https://github.com/anthropics/claude-code-action for the current tag) rather than
# leaving it floating -- this file uses `@v1` as a placeholder since the exact current tag wasn't
# verified while writing this.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI diff review (deny checklist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code review against the deny checklist
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing `git diff origin/main...HEAD` for the Otterling parental-control
            app's update-review pipeline. Read scripts/update_review_checklist.md in full first,
            then check the diff against every item in it.

            This diff, if it passes, gets built, signed with the real production release key, and
            can be silently auto-installed on a managed phone with no further human review except
            the Guardian's environment-approval step after you. Treat "does this diff weaken,
            remove, or make conditional/bypassable any protection on that checklist" as the only
            question that matters -- not code style, not unrelated bugs, not whether the feature
            itself is a good idea.

            Read every file the checklist references that the diff touches, not just the diff
            hunks in isolation -- a change can look innocuous in isolation but remove the only
            call site that wired something up.

            End your response with exactly one final line, verbatim:
              VERDICT: PASS
            or:
              VERDICT: FAIL: <one-sentence reason>
          claude_args: |
            --max-turns 30

      - name: Enforce verdict
        run: |
          if ! grep -q "VERDICT: PASS" <<< "${{ steps.review.outputs.output }}"; then
            echo "::error::AI review did not PASS -- blocking release. See the review step's output above."
            exit 1
          fi

  sign-and-publish:
    name: Sign and publish (Guardian-approved)
    needs: ai-review
    runs-on: ubuntu-latest
    # Configure this in the repo's Settings -> Environments as `release` with a required reviewer
    # (the Guardian's GitHub account) -- GitHub then blocks this job on that approval regardless of
    # the AI review's PASS above. This is the actual root of trust; the AI review is friction, not
    # the gate itself (see the plan doc / README "Out of scope" note).
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: /tmp/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: ./gradlew :app:assembleRelease

      - name: Compute manifest fields
        id: manifest
        run: |
          set -euo pipefail
          apk_path=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          sha256=$(sha256sum "$apk_path" | cut -d' ' -f1)
          version_code=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          version_name=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/.*"(.*)"/\1/')
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Write manifest.json
        run: |
          cat > manifest.json <<JSON
          {
            "versionCode": ${{ steps.manifest.outputs.version_code }},
            "versionName": "${{ steps.manifest.outputs.version_name }}",
            "apkUrl": "https://${{ secrets.UPDATE_HOST }}/updates/otterling-${{ steps.manifest.outputs.version_name }}.apk",
            "sha256": "${{ steps.manifest.outputs.sha256 }}"
          }
          JSON

      - name: Publish APK + manifest to the family's update host
        env:
          SSH_HOST: ${{ secrets.UPDATE_HOST }}
          SSH_USER: ${{ secrets.UPDATE_HOST_SSH_USER }}
          SSH_KEY: ${{ secrets.UPDATE_HOST_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          version_name="${{ steps.manifest.outputs.version_name }}"
          scp -i ~/.ssh/deploy_key "${{ steps.manifest.outputs.apk_path }}" \
            "$SSH_USER@$SSH_HOST:filter-server/updates/otterling-$version_name.apk"
          scp -i ~/.ssh/deploy_key manifest.json \
            "$SSH_USER@$SSH_HOST:filter-server/updates/manifest.json"
