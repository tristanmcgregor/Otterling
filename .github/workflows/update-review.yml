name: Update review (advisory only)

# Release is NOT done from GitHub. Git cannot change the production pipeline:
# /var/lib/otterling/ci/release.sh (root-owned on the update host) is the only
# path that signs and publishes. See filter-server/SELF_LOCKOUT.md.
#
# This workflow may comment on PRs for convenience, but a PASS here does not
# publish anything. Do not re-add a sign-and-publish job.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  advisory-note:
    name: Release is server-side only
    runs-on: ubuntu-latest
    steps:
      - name: Remind that git cannot release
        run: |
          echo "::notice::Otterling releases run only via sudo otterling-release on the update host."
          echo "Checklist + pipeline live under /var/lib/otterling/ci/ (root-owned), not in this repo."
          echo "Changing this workflow cannot publish an APK."
