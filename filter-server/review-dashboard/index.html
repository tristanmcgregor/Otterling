<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Otterling release review</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    color-scheme: dark light;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --mono-bg: #0b0d11;
    --pass: #3fb950;
    --fail: #f85149;
    --pending: #d29922;
    --idle: #6e7681;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-border: #e2e5ea;
      --text: #1c2128;
      --text-dim: #57606a;
      --mono-bg: #f0f1f3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
    max-width: 920px;
    margin-inline: auto;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .badge.pass { background: color-mix(in srgb, var(--pass) 20%, transparent); color: var(--pass); }
  .badge.fail { background: color-mix(in srgb, var(--fail) 20%, transparent); color: var(--fail); }
  .badge.pending { background: color-mix(in srgb, var(--pending) 20%, transparent); color: var(--pending); }
  .badge.idle { background: color-mix(in srgb, var(--idle) 25%, transparent); color: var(--idle); }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .pending .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .meta {
    color: var(--text-dim);
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .meta code {
    background: var(--mono-bg);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.82rem;
  }
  .section-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 20px 0 8px;
  }
  pre.ai-output {
    background: var(--mono-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px;
    font-size: 0.82rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 480px;
    overflow-y: auto;
    margin: 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--panel-border);
    vertical-align: top;
  }
  th {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  tr:last-child td { border-bottom: none; }
  .empty {
    color: var(--text-dim);
    font-size: 0.9rem;
    padding: 8px 0;
  }
  .error-banner {
    background: color-mix(in srgb, var(--fail) 15%, transparent);
    border: 1px solid var(--fail);
    color: var(--fail);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
    margin-bottom: 20px;
    display: none;
  }
  .refresh-note {
    color: var(--text-dim);
    font-size: 0.75rem;
    text-align: right;
  }
</style>
</head>
<body>
  <h1>Otterling release review</h1>
  <div class="subtitle">Server-side AI review status for the gated release pipeline -- see filter-server/SELF_LOCKOUT.md.</div>

  <div id="error-banner" class="error-banner"></div>

  <div class="panel">
    <div class="status-row">
      <span id="status-badge" class="badge idle"><span class="dot"></span><span id="status-label">No data yet</span></span>
      <span id="commit-sha" class="meta"></span>
    </div>
    <div id="meta" class="meta" style="margin-top: 12px;"></div>

    <div class="section-title">AI review output</div>
    <pre id="ai-output" class="ai-output">Waiting for review-status.json...</pre>
  </div>

  <div class="panel">
    <div class="section-title" style="margin-top: 0;">Recent releases</div>
    <div id="history-container"><div class="empty">No history yet.</div></div>
  </div>

  <div class="refresh-note" id="refresh-note"></div>

<script>
const DATA_BASE = "/review-data";
const POLL_MS = 5000;

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function badgeClassFor(state, verdict) {
  if (state === "reviewing") return "pending";
  if (verdict === "PASS") return "pass";
  if (verdict === "FAIL") return "fail";
  return "idle";
}

function labelFor(state, verdict) {
  if (state === "reviewing") return "Reviewing...";
  if (state === "done" && verdict === "PASS") return "PASS";
  if (state === "done" && verdict === "FAIL") return "FAIL";
  return "Idle";
}

function formatTime(iso) {
  if (!iso) return "--";
  try {
    return new Date(iso).toLocaleString();
  } catch {
    return iso;
  }
}

function renderStatus(data) {
  const badge = document.getElementById("status-badge");
  const label = document.getElementById("status-label");
  const cls = badgeClassFor(data.state, data.verdict);
  badge.className = "badge " + cls;
  label.textContent = labelFor(data.state, data.verdict);

  document.getElementById("commit-sha").innerHTML = data.commit_sha
    ? `<code>${escapeHtml(data.commit_sha.slice(0, 12))}</code>`
    : "";

  const metaParts = [];
  if (data.commit_message) metaParts.push(escapeHtml(data.commit_message));
  if (data.started_at) metaParts.push(`Started: ${formatTime(data.started_at)}`);
  if (data.finished_at) metaParts.push(`Finished: ${formatTime(data.finished_at)}`);
  if (data.verdict_reason) metaParts.push(escapeHtml(data.verdict_reason));
  if (data.published_version) metaParts.push(`Published: v${escapeHtml(data.published_version)}`);
  document.getElementById("meta").innerHTML = metaParts.join(" &middot; ") || "No release has run yet.";

  const output = document.getElementById("ai-output");
  output.textContent = data.ai_output || (data.state === "reviewing"
    ? "Review in progress -- output will appear once the AI finishes."
    : "No AI output recorded for this run.");
}

function renderHistory(list) {
  const container = document.getElementById("history-container");
  if (!Array.isArray(list) || list.length === 0) {
    container.innerHTML = '<div class="empty">No history yet.</div>';
    return;
  }
  const rows = list.map((entry) => {
    const cls = badgeClassFor(entry.state, entry.verdict);
    const label = labelFor(entry.state, entry.verdict);
    return `<tr>
      <td><span class="badge ${cls}"><span class="dot"></span>${escapeHtml(label)}</span></td>
      <td><code>${escapeHtml((entry.commit_sha || "").slice(0, 12))}</code></td>
      <td>${escapeHtml(entry.commit_message || "")}</td>
      <td>${escapeHtml(entry.published_version ? "v" + entry.published_version : "")}</td>
      <td>${formatTime(entry.finished_at || entry.started_at)}</td>
    </tr>`;
  }).join("");
  container.innerHTML = `<table>
    <thead><tr><th>Verdict</th><th>Commit</th><th>Message</th><th>Version</th><th>When</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function fetchJson(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
  return response.json();
}

async function refresh() {
  const errorBanner = document.getElementById("error-banner");
  try {
    const status = await fetchJson(`${DATA_BASE}/status.json`);
    renderStatus(status);
    errorBanner.style.display = "none";
  } catch (error) {
    errorBanner.textContent = "No review data yet -- release.sh hasn't been wired up to write "
      + "status.json yet (see filter-server/review-dashboard/README.md), or no release has run.";
    errorBanner.style.display = "block";
  }

  try {
    const history = await fetchJson(`${DATA_BASE}/history.json`);
    renderHistory(history);
  } catch {
    // History is best-effort -- the status banner above already reports the missing-data case.
  }

  document.getElementById("refresh-note").textContent =
    `Last checked ${new Date().toLocaleTimeString()} -- refreshes every ${POLL_MS / 1000}s`;
}

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
