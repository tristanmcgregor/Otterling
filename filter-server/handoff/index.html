<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Otterling — Set up your password</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0b0e14; color: #e6e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  form, #invalid, #success {
    width: 320px; padding: 28px; border-radius: 14px;
    background: #131722; border: 1px solid #232838;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  p.sub { margin: 0 0 8px; font-size: 12px; color: #9aa3b5; }
  label { font-size: 12px; color: #9aa3b5; }
  input {
    width: 100%; box-sizing: border-box; padding: 9px 10px; margin-top: 4px;
    border-radius: 8px; border: 1px solid #2a3040; background: #0f1320; color: #e6e8ee;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: #5b6ee8; }
  button, a.button {
    margin-top: 6px; padding: 10px; border-radius: 8px; border: none;
    background: #5b6ee8; color: white; font-size: 14px; font-weight: 600; cursor: pointer;
    text-align: center; text-decoration: none; display: block; box-sizing: border-box;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #error { color: #ff6b6b; font-size: 12px; min-height: 14px; }
  #invalid p, #success p { margin: 0; font-size: 13px; color: #c3c8d4; line-height: 1.5; }
</style>
</head>
<body>
  <form id="setupForm" style="display: none;">
    <h1>Set up your password</h1>
    <p class="sub">Choose a password for the Otterling dashboard. This link only works once.</p>
    <div>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" autofocus />
    </div>
    <div>
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" />
    </div>
    <div id="error"></div>
    <button type="submit" id="submitBtn">Set password</button>
  </form>

  <div id="invalid" style="display: none;">
    <h1>Link not valid</h1>
    <p>This handoff link is missing, has already been used, or has expired. Ask for a new one.</p>
  </div>

  <div id="success" style="display: none;">
    <h1>Password set</h1>
    <p>You're all set. Sign in to the dashboard with your new password.</p>
    <a class="button" href="/dashboard-login/">Go to sign in</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const setupForm = document.getElementById('setupForm');
    const invalidEl = document.getElementById('invalid');
    const successEl = document.getElementById('success');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      invalidEl.style.display = 'flex';
    } else {
      setupForm.style.display = 'flex';
    }

    setupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Setting password…';
      try {
        const response = await fetch('/handoff-auth/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password }),
        });
        if (response.ok) {
          setupForm.style.display = 'none';
          successEl.style.display = 'flex';
          return;
        }
        const data = await response.json().catch(() => ({}));
        if (response.status === 400 && /invalid|expired/i.test(data.error || '')) {
          setupForm.style.display = 'none';
          invalidEl.style.display = 'flex';
          return;
        }
        errorEl.textContent = data.error || 'Could not set password.';
      } catch (error) {
        errorEl.textContent = 'Could not reach the server.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set password';
      }
    });
  </script>
</body>
</html>
