services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: otterling-filter-server
    restart: unless-stopped
    ports:
      # Admin UI (AdGuard moves here after setup; keep it on 3000 — host firewall blocks docker→:80).
      # ADMIN_UI_BIND defaults to 0.0.0.0 (matches this project's prior behavior -- families reach
      # this directly, not through Caddy, same "deliberately internet-reachable" reasoning as the
      # mitmproxy service below) but is here, not hardcoded, specifically so the mitigation
      # README.md's Firewall section recommends (restrict to the phone's IP / an allowlist) can be
      # applied without editing this file -- same pattern dns-classifier's DNS_BIND already uses.
      - "${ADMIN_UI_BIND:-0.0.0.0}:${ADMIN_UI_PORT:-3000}:3000/tcp"
      # No LAN-facing DNS port here anymore -- dns-classifier now holds it (below) and relays
      # here internally over Docker's own network (adguardhome:53). Parental control/Safe Search
      # and the blocklists configured in its own UI still apply to everything relayed through.
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: otterling-mitmproxy
    restart: unless-stopped
    # Host unbound/CleanBrowsing NXDOMAINs social domains (e.g. reddit.com). Use public DNS so
    # mitmproxy can still dial those hosts and apply path/title filtering instead of returning 502.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      # Internal listen is always 8080; host port is usually 8090 with port8080_mux.py on 8080.
      - "${PROXY_PORT:-8090}:8080/tcp"
    volumes:
      # Persists the generated CA (mitmproxy creates ~/.mitmproxy/mitmproxy-ca-cert.pem here on
      # first run if this is empty) plus any other mitmproxy state across container restarts.
      - ./mitm-ca:/home/mitmproxy/.mitmproxy
      - ./mitm_nsfw_addon.py:/home/mitmproxy/mitm_nsfw_addon.py:ro
      # mitm_nsfw_addon.py imports these two as local modules (mitmproxy's script loader puts the
      # addon's own directory on sys.path) -- same files volume-mounted into dns-classifier below,
      # so both containers check the exact same blocklist/classifier logic without sharing a process.
      - ./ai_classifier.py:/home/mitmproxy/ai_classifier.py:ro
      - ./domain_blocklist.py:/home/mitmproxy/domain_blocklist.py:ro
    environment:
      - PROXY_USER=${PROXY_USER:-otterling}
      - PROXY_PASSWORD=${PROXY_PASSWORD:?set PROXY_PASSWORD in .env}
      # Used by mitm_nsfw_addon.py's third-tier AI classifier -- same key already deployed for
      # the release-review pipeline (/var/lib/otterling/ci/secrets.env), reused here rather than
      # provisioning a second one. Addon fails open (no block) if this is unset.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # Regular (non-transparent) HTTP CONNECT proxy mode: the Android app tunnels each TCP 80/443
    # flow here via CONNECT, mitmproxy dials the real destination itself, and auto-detects TLS vs
    # plain HTTP inside the tunnel so both get inspected by mitm_nsfw_addon.py -- no in-page
    # scrubbing, only full request/response block per that addon.
    #
    # block_global=false: mitmproxy's own default (block_global=true) kills any client connection
    # whose source IP isn't private/local -- a safety net against accidentally exposing an open
    # relay. But this proxy is deliberately internet-reachable (phones connect from outside the
    # home network too, not just LAN), and every such connection looks "global-sourced" to
    # mitmproxy post-NAT regardless of whether it's genuinely external or just hairpinned --
    # confirmed via `docker compose logs mitmproxy` showing "killed by block_global option" for
    # every non-LAN-direct connection attempt. --proxyauth above is the actual access control here,
    # not source-IP filtering.
    command: >
      mitmdump
      --mode regular
      --listen-port 8080
      --proxyauth "${PROXY_USER:-otterling}:${PROXY_PASSWORD}"
      --set confdir=/home/mitmproxy/.mitmproxy
      --set block_global=false
      -s /home/mitmproxy/mitm_nsfw_addon.py

  dns-classifier:
    image: python:3.12-slim
    container_name: otterling-dns-classifier
    restart: unless-stopped
    depends_on:
      - adguardhome
    ports:
      # Takes over the LAN-facing DNS port AdGuardHome used to hold. tcp binding just closes the
      # port rather than handling it -- v1 is UDP-only, see dns_classify_mux.py's docstring.
      - "${DNS_BIND:-192.168.0.254}:${DNS_PORT:-53}:53/tcp"
      - "${DNS_BIND:-192.168.0.254}:${DNS_PORT:-53}:53/udp"
    volumes:
      - ./dns_classify_mux.py:/opt/otterling/dns_classify_mux.py:ro
      - ./ai_classifier.py:/opt/otterling/ai_classifier.py:ro
      - ./domain_blocklist.py:/opt/otterling/domain_blocklist.py:ro
    environment:
      # Same key already deployed for the release-review pipeline and mitm_nsfw_addon.py's own
      # third-tier classifier -- reused here rather than provisioning a third one. Fails open (no
      # block, domain resolves normally) if unset.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DNS_MUX_LISTEN_HOST=0.0.0.0
      - DNS_MUX_LISTEN_PORT=53
      - UPSTREAM_DNS_HOST=adguardhome
      - UPSTREAM_DNS_PORT=53
    working_dir: /opt/otterling
    # No outbound-HTTPS proxy config needed -- mitmproxy already does unrestricted outbound
    # fetches (its own domain-list refresh) from a plain Docker container on this same host, so
    # this container behaves the same way for its homepage-fetch/AI-classification calls.
    command: python3 dns_classify_mux.py

  lockprofile:
    image: python:3.12-slim
    container_name: otterling-lockprofile
    restart: unless-stopped
    ports:
      # Loopback-only -- reached through Caddy (see Caddyfile), never exposed directly. Same
      # reasoning as the admin UI note in README.md's Firewall section.
      - "127.0.0.1:${LOCKPROFILE_PORT:-8091}:8091/tcp"
    volumes:
      - ./lockprofile_service.py:/opt/otterling/lockprofile_service.py:ro
      - ./lockprofile-data:/data
    environment:
      - LOCKPROFILE_TOKEN=${LOCKPROFILE_TOKEN:?set LOCKPROFILE_TOKEN in .env}
      - LOCKPROFILE_LISTEN_PORT=8091
      # Optional -- blank disables push notification, events still log to lockprofile-data/alerts/.
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
    working_dir: /opt/otterling
    command: python3 lockprofile_service.py

  updates:
    image: caddy:alpine
    container_name: otterling-updates
    restart: unless-stopped
    # Host networking: docker-proxy DNAT on this host breaks TLS to the container (phones and
    # host curls see SSL_ERROR_SYSCALL / connection reset). Binding Caddy directly on :80/:443
    # matches how ACME and phone updates actually reach the box.
    network_mode: host
    environment:
      - UPDATE_HOST=${UPDATE_HOST:-vpn.bartholomew.help}
      - REVIEW_DASHBOARD_USER=${REVIEW_DASHBOARD_USER:-guardian}
      - REVIEW_DASHBOARD_PASSWORD_HASH=${REVIEW_DASHBOARD_PASSWORD_HASH:?set REVIEW_DASHBOARD_PASSWORD_HASH in .env, see review-dashboard/README.md}
      # Injected onto outbound requests to lockprofile for the /device-logs/view/* routes below --
      # same token as the lockprofile service itself (LOCKPROFILE_TOKEN in .env), so a browser
      # authenticated only by the /review Basic Auth can view uploaded device logs without ever
      # learning this token directly.
      - LOCKPROFILE_TOKEN=${LOCKPROFILE_TOKEN:?set LOCKPROFILE_TOKEN in .env}
      # Host CBLOCK blocks direct outbound 443; ACME renewals need the local forward proxy.
      - HTTP_PROXY=http://127.0.0.1:3128
      - HTTPS_PROXY=http://127.0.0.1:3128
      - NO_PROXY=127.0.0.1,localhost,192.168.0.0/16
    volumes:
      # Host path is owned by otterling-deploy (CI SFTP only). Not the git checkout.
      - /var/lib/otterling/updates:/srv/updates:ro
      # Written by release.sh (root-owned host script, not in git) after each review -- see
      # review-dashboard/README.md for the JSON schema it must write.
      - /var/lib/otterling/review:/srv/review-data:ro
      # The dashboard page itself ships in git, unlike the two mounts above.
      - ./review-dashboard:/srv/review-dashboard:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config

