services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: otterling-filter-server
    restart: unless-stopped
    ports:
      # Admin UI (AdGuard moves here after setup; keep it on 3000 — host firewall blocks docker→:80).
      # ADMIN_UI_BIND defaults to 0.0.0.0 (matches this project's prior behavior -- families reach
      # this directly, not through Caddy, same "deliberately internet-reachable" reasoning as the
      # mitmproxy service below) but is here, not hardcoded, specifically so the mitigation
      # README.md's Firewall section recommends (restrict to the phone's IP / an allowlist) can be
      # applied without editing this file -- same pattern dns-classifier's DNS_BIND already uses.
      - "${ADMIN_UI_BIND:-0.0.0.0}:${ADMIN_UI_PORT:-3000}:3000/tcp"
      # No LAN-facing DNS port here anymore -- dns-classifier now holds it (below) and relays
      # here internally over Docker's own network (adguardhome:53). Parental control/Safe Search
      # and the blocklists configured in its own UI still apply to everything relayed through.
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf

  mitmproxy:
    # Built from mitmproxy.Dockerfile (stock mitmproxy/mitmproxy:latest + the Claude Code CLI) so
    # ai_classifier.py can shell out to `claude -p` -- see that Dockerfile's header comment. Image
    # is tagged and built via `docker compose build`; deploy_filter_server.sh runs `up -d --no-build`
    # so a normal deploy reuses the already-built tag rather than rebuilding on every push.
    image: otterling-mitmproxy-claude:latest
    build:
      context: .
      dockerfile: mitmproxy.Dockerfile
    container_name: otterling-mitmproxy
    restart: unless-stopped
    # `./mitm-ca` on the host MUST stay owned by uid:gid 1000:1000 (the image's own built-in
    # `mitmproxy` user -- confirmed via `docker run --rm mitmproxy/mitmproxy:latest id mitmproxy`),
    # not whatever host user happens to run docker. The image's own docker-entrypoint.sh runs
    # `usermod -u $(stat -u confdir) -g $(stat -g confdir) mitmproxy` as root on every single start,
    # unconditionally (see `set -o errexit` at its top -- a failure here aborts the container before
    # it ever execs mitmdump). `usermod -g` requires the target GID to already exist as a named
    # group; the image defines only `mitmproxy:1000`, so any confdir owner GID other than 1000 makes
    # every startup fail outright ("usermod: group '<gid>' does not exist", exit 6, crash-loop) --
    # this took real content filtering down on 2026-08-18 when the directory ended up owned by the
    # host's admin user (1001:1001) instead. Do NOT try to fix this with a `user:` override here --
    # that skips entrypoint's usermod call entirely, which needs root to run `gosu` and drop
    # privileges afterward, and breaks in a different way (confirmed: "usermod: invalid user ID
    # '-g'", "Permission denied" statting the confdir). The actual fix is keeping the host directory
    # at 1000:1000; if it ever needs recreating, `sudo chown -R 1000:1000 ./mitm-ca` first.
    # Host unbound/CleanBrowsing NXDOMAINs social domains (e.g. reddit.com). Use public DNS so
    # mitmproxy can still dial those hosts and apply path/title filtering instead of returning 502.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      # Internal listen is always 8080; host port is usually 8090 with port8080_mux.py on 8080.
      - "${PROXY_PORT:-8090}:8080/tcp"
    volumes:
      # Persists the generated CA (mitmproxy creates ~/.mitmproxy/mitmproxy-ca-cert.pem here on
      # first run if this is empty) plus any other mitmproxy state across container restarts.
      - ./mitm-ca:/home/mitmproxy/.mitmproxy
      - ./mitm_nsfw_addon.py:/home/mitmproxy/mitm_nsfw_addon.py:ro
      # mitm_nsfw_addon.py imports these two as local modules (mitmproxy's script loader puts the
      # addon's own directory on sys.path) -- same files volume-mounted into dns-classifier below,
      # so both containers check the exact same blocklist/classifier logic without sharing a process.
      - ./ai_classifier.py:/home/mitmproxy/ai_classifier.py:ro
      - ./domain_blocklist.py:/home/mitmproxy/domain_blocklist.py:ro
      # Trigger-word reporting: block_reporter.py POSTs a `trigger_word_detected` alert to the phone
      # when trigger_words.py finds a listed word on a blocked page. Same volume-mount-not-import
      # pattern as the two files above.
      - ./trigger_words.py:/home/mitmproxy/trigger_words.py:ro
      - ./block_reporter.py:/home/mitmproxy/block_reporter.py:ro
      # Replaces the built-in --proxyauth mechanism (see proxy_auth_gate.py's docstring for why):
      # same Basic-auth semantics, but skips the challenge for PROXY_AUTH_EXEMPT_IPS.
      - ./proxy_auth_gate.py:/home/mitmproxy/proxy_auth_gate.py:ro
    environment:
      - PROXY_USER=${PROXY_USER:-otterling}
      - PROXY_PASSWORD=${PROXY_PASSWORD:?set PROXY_PASSWORD in .env}
      # Household egress IP(s) that skip proxy auth entirely -- see proxy_auth_gate.py. Needed so
      # the Mac's system-wide proxy (macos/FocusLock ProxyEnforcer.swift) works for every process,
      # including non-interactive system daemons that can't answer a Basic-auth challenge. Comma-
      # separated; update if the household's public IP changes. Empty = auth required for everyone
      # (safe default -- an unset/misconfigured value never accidentally opens the proxy).
      - PROXY_AUTH_EXEMPT_IPS=${PROXY_AUTH_EXEMPT_IPS:-}
      # Used by mitm_nsfw_addon.py's third-tier AI classifier (ai_classifier.py) -- a subscription
      # OAuth token from `claude setup-token`, not a metered API key (see mitmproxy.Dockerfile).
      # Deliberately NOT also setting ANTHROPIC_API_KEY here: it outranks this token in Claude
      # Code's credential precedence, so leaving both set would silently defeat the switch.
      # Addon fails open (no block) if this is unset.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # block_reporter.py POSTs trigger-word alerts here. This container's DNS is overridden to
      # public resolvers (see `dns:` above), so it can't resolve the internal `lockprofile` service
      # name -- it reports to the PUBLIC /alerts/tamper the same way phones do, back through Caddy.
      - ALERTS_URL=${ALERTS_URL:-https://vpn.bartholomew.help/alerts/tamper}
      - LOCKPROFILE_TOKEN=${LOCKPROFILE_TOKEN:?set LOCKPROFILE_TOKEN in .env}
    # Regular (non-transparent) HTTP CONNECT proxy mode: the Android app tunnels each TCP 80/443
    # flow here via CONNECT, mitmproxy dials the real destination itself, and auto-detects TLS vs
    # plain HTTP inside the tunnel so both get inspected by mitm_nsfw_addon.py -- no in-page
    # scrubbing, only full request/response block per that addon.
    #
    # block_global=false: mitmproxy's own default (block_global=true) kills any client connection
    # whose source IP isn't private/local -- a safety net against accidentally exposing an open
    # relay. But this proxy is deliberately internet-reachable (phones connect from outside the
    # home network too, not just LAN), and every such connection looks "global-sourced" to
    # mitmproxy post-NAT regardless of whether it's genuinely external or just hairpinned --
    # confirmed via `docker compose logs mitmproxy` showing "killed by block_global option" for
    # every non-LAN-direct connection attempt. proxy_auth_gate.py (loaded below, NOT --proxyauth --
    # the two must not both be active, or requests get double-gated) is the actual access control.
    command: >
      mitmdump
      --mode regular
      --listen-port 8080
      --set confdir=/home/mitmproxy/.mitmproxy
      --set block_global=false
      -s /home/mitmproxy/proxy_auth_gate.py
      -s /home/mitmproxy/mitm_nsfw_addon.py

  dns-classifier:
    # Built from dns-classifier.Dockerfile (stock python:3.12-slim + the Claude Code CLI + an
    # unprivileged claude-runner account) -- see that Dockerfile's header comment. Image is tagged
    # and built via `docker compose build`; deploy_filter_server.sh runs `up -d --no-build` so a
    # normal deploy reuses the already-built tag rather than rebuilding on every push.
    image: otterling-dns-classifier-claude:latest
    build:
      context: .
      dockerfile: dns-classifier.Dockerfile
    container_name: otterling-dns-classifier
    restart: unless-stopped
    depends_on:
      - adguardhome
    ports:
      # Takes over the LAN-facing DNS port AdGuardHome used to hold. tcp binding just closes the
      # port rather than handling it -- v1 is UDP-only, see dns_classify_mux.py's docstring.
      - "${DNS_BIND:-192.168.0.254}:${DNS_PORT:-53}:53/tcp"
      - "${DNS_BIND:-192.168.0.254}:${DNS_PORT:-53}:53/udp"
    volumes:
      - ./dns_classify_mux.py:/opt/otterling/dns_classify_mux.py:ro
      - ./ai_classifier.py:/opt/otterling/ai_classifier.py:ro
      - ./domain_blocklist.py:/opt/otterling/domain_blocklist.py:ro
    environment:
      # Same subscription OAuth token as mitm_nsfw_addon.py's classifier -- see its docker-compose
      # comment for why ANTHROPIC_API_KEY is deliberately NOT also set here. Fails open (no block,
      # domain resolves normally) if unset.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - DNS_MUX_LISTEN_HOST=0.0.0.0
      - DNS_MUX_LISTEN_PORT=53
      - UPSTREAM_DNS_HOST=adguardhome
      - UPSTREAM_DNS_PORT=53
    working_dir: /opt/otterling
    # No outbound-HTTPS proxy config needed -- mitmproxy already does unrestricted outbound
    # fetches (its own domain-list refresh) from a plain Docker container on this same host, so
    # this container behaves the same way for its homepage-fetch/AI-classification calls.
    command: python3 dns_classify_mux.py

  lockprofile:
    image: python:3.12-slim
    container_name: otterling-lockprofile
    restart: unless-stopped
    ports:
      # Loopback-only -- reached through Caddy (see Caddyfile), never exposed directly. Same
      # reasoning as the admin UI note in README.md's Firewall section.
      - "127.0.0.1:${LOCKPROFILE_PORT:-8091}:8091/tcp"
    volumes:
      - ./lockprofile_service.py:/opt/otterling/lockprofile_service.py:ro
      - ./report_types.json:/opt/otterling/report_types.json:ro
      - ./lockprofile-data:/data
    # Lets this container reach the host-level sudo_review_server.py (see that file and
    # lockprofile_service.py's SUDO_REVIEW_URL) -- `host-gateway` is the Docker Engine special value
    # that resolves to the host's own bridge-gateway IP on Linux (Docker Desktop provides this
    # mapping automatically; Linux Engine needs it declared explicitly like this).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LOCKPROFILE_TOKEN=${LOCKPROFILE_TOKEN:?set LOCKPROFILE_TOKEN in .env}
      - FLEET_WEBHOOK_SECRET=${FLEET_WEBHOOK_SECRET:-}
      - LOCKPROFILE_LISTEN_PORT=8091
      # Maps hostname/IP-based device_ids (Fleet webhook display names, block_reporter's client
      # IPs) onto the one canonical IOPlatformUUID-based id TamperReporter.swift/
      # install_lock_profile.py already use for the same physical Mac -- see
      # lockprofile_service.py's DEVICE_ID_ALIASES doc for why this exists.
      - DEVICE_ID_ALIASES=${DEVICE_ID_ALIASES:-}
      # One shared guardian login, password-only (no username), for BOTH the device-settings
      # dashboard and /review (see lockprofile_service.py's GUARDIAN_LOGIN_PASSWORD comment and
      # Caddyfile's /dashboard-auth/* + /review-auth/*) -- blank means both login routes always
      # reject, matching the project's fail-closed stance for anything gating access rather than
      # DNS/proxy enforcement. Falls back to REVIEW_LOGIN_PASSWORD if only that's set (pre-unification
      # deployments); REVIEW_DASHBOARD_PASSWORD_HASH/REVIEW_DASHBOARD_USER in .env are unrelated
      # leftovers from Caddy's own basicauth, removed from /review 2026-08-18, never read anywhere.
      - DASHBOARD_LOGIN_PASSWORD=${DASHBOARD_LOGIN_PASSWORD:-}
      - REVIEW_LOGIN_PASSWORD=${REVIEW_LOGIN_PASSWORD:-}
      # Optional -- blank disables push notification, events still log to lockprofile-data/alerts/.
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      # Optional FCM push (instant phone wake). Point this at a Firebase service-account JSON dropped
      # into the mounted data dir; absent = FCM inert, ntfy + polling unaffected. See the
      # FCM_CREDENTIALS_PATH note in lockprofile_service.py.
      - FCM_CREDENTIALS_PATH=${FCM_CREDENTIALS_PATH:-/data/fcm-service-account.json}
    working_dir: /opt/otterling
    # google-auth is only needed for the optional FCM push; installed at start rather than via a
    # Dockerfile to keep this a mounted-script service. If the install fails (offline boot), FCM
    # stays inert and ntfy + polling still work.
    command: sh -c "pip install --no-cache-dir --quiet google-auth requests || true; python3 lockprofile_service.py"

  updates:
    image: caddy:alpine
    container_name: otterling-updates
    restart: unless-stopped
    # Host networking: docker-proxy DNAT on this host breaks TLS to the container (phones and
    # host curls see SSL_ERROR_SYSCALL / connection reset). Binding Caddy directly on :80/:443
    # matches how ACME and phone updates actually reach the box.
    network_mode: host
    environment:
      - UPDATE_HOST=${UPDATE_HOST:-vpn.bartholomew.help}
      # Both dashboards' former DASHBOARD_USER/DASHBOARD_PASSWORD_HASH and REVIEW_DASHBOARD_USER/
      # REVIEW_DASHBOARD_PASSWORD_HASH Basic Auth vars used to live here, but Caddy's basicauth
      # directives that read them are gone -- credential-checking for both now lives entirely on
      # the lockprofile service (see lockprofile_service.py's GUARDIAN_LOGIN_PASSWORD comment),
      # Caddy just forward_auths to it.
      # Injected onto outbound requests to lockprofile for the /device-logs/view/* and
      # /dashboard-api/* routes below -- same token as the lockprofile service itself
      # (LOCKPROFILE_TOKEN in .env), so a browser authenticated only by Basic Auth can reach either
      # dashboard without ever learning this token directly.
      - LOCKPROFILE_TOKEN=${LOCKPROFILE_TOKEN:?set LOCKPROFILE_TOKEN in .env}
      - FLEET_WEBHOOK_SECRET=${FLEET_WEBHOOK_SECRET:-}
      # Host CBLOCK blocks direct outbound 443; ACME renewals need the local forward proxy.
      - HTTP_PROXY=http://127.0.0.1:3128
      - HTTPS_PROXY=http://127.0.0.1:3128
      - NO_PROXY=127.0.0.1,localhost,192.168.0.0/16
    volumes:
      # Host path is owned by otterling-deploy (CI SFTP only). Not the git checkout.
      - /var/lib/otterling/updates:/srv/updates:ro
      # Written by release.sh (root-owned host script, not in git) after each review -- see
      # review-dashboard/README.md for the JSON schema it must write.
      - /var/lib/otterling/review:/srv/review-data:ro
      # The dashboard page itself ships in git, unlike the two mounts above.
      - ./review-dashboard:/srv/review-dashboard:ro
      # Device-settings dashboard's built static assets -- also ships in git (see
      # filter-server/dashboard/README.md), rebuilt+recommitted on source changes, no Node needed
      # on this host.
      - ./dashboard/dist:/srv/dashboard:ro
      # Standalone login page for the dashboard above (see Caddyfile's /dashboard-auth/* +
      # forward_auth) -- deliberately its own tiny static page, not part of the dashboard/ React
      # app, so it can be served un-authenticated without carving an exception into the @dashboard
      # matcher that gates everything else.
      - ./dashboard-login:/srv/dashboard-login:ro
      # Same standalone-login-page pattern as dashboard-login above, for /review et al -- see
      # Caddyfile's /review-auth/* + forward_auth.
      - ./review-login:/srv/review-login:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config

